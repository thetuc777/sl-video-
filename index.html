<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SL Video Manager — Øzak</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:wght@300;400&display=swap');

:root {
  --bg:#080808;
  --text:#f5f3ed;
  --muted:#8a867a;
  --accent:#c8c0a8;
  --border:#2c2c2c;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Cormorant Garamond',serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:3rem 1rem;
}

/* TITLE */
h1{
  font-family:'Cinzel',serif;
  font-size:2.2rem;
  letter-spacing:4px;
  margin-bottom:10px;
}

.by{
  font-size:0.5em;
  color:var(--accent);
  letter-spacing:2px;
}

/* INPUT */
input{
  width:100%;
  max-width:500px;
  padding:12px;
  margin-bottom:25px;
  background:none;
  border:none;
  border-bottom:1px solid var(--border);
  color:var(--text);
}

/* OPTIONS */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  max-width:500px;
  width:100%;
}

.opt{
  border:1px solid var(--border);
  padding:12px;
  cursor:pointer;
  text-align:center;
}

.opt.active{
  border-color:var(--accent);
  background:rgba(200,192,168,0.05);
}

/* BUTTON */
button{
  margin-top:20px;
  padding:15px;
  width:100%;
  max-width:500px;
  background:none;
  border:1px solid var(--accent);
  color:var(--accent);
  cursor:pointer;
}

/* RESULT */
.result{
  margin-top:30px;
  max-width:500px;
  word-break:break-all;
}
</style>
</head>

<body>

<h1>SL Video <span class="by">— by Øzak</span></h1>

<input id="url" placeholder="Lien Dropbox...">

<div class="grid">

<div class="opt active" onclick="t(this,'autoplay')">Autoplay</div>
<div class="opt active" onclick="t(this,'loop')">Loop</div>
<div class="opt active" onclick="t(this,'mute')">Mute</div>
<div class="opt" onclick="t(this,'controls')">Controls</div>

<div class="opt active" onclick="t(this,'responsive')">Responsive</div>
<div class="opt" onclick="t(this,'hideAudio')">Hide Audio</div>

<div class="opt" onclick="t(this,'cover')">Fit Cover</div>

</div>

<button onclick="gen()">Générer</button>

<div class="result" id="out"></div>

<script>
let state={
  autoplay:true,
  loop:true,
  mute:true,
  controls:false,
  responsive:true,
  hideAudio:false,
  cover:false
};

function t(el,key){
  state[key]=!state[key];
  el.classList.toggle("active");
}

function gen(){

  const url=document.getElementById("url").value;

  let p=new URLSearchParams();
  p.set("url",url);

  for(let k in state){
    if(state[k]) p.set(k,"1");
  }

  let base=location.href.replace("index.html","");
  let final=base+"player.html?"+p.toString();

  document.getElementById("out").innerText=final;
}
</script>

</body>
</html>
