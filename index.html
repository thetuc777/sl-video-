<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Øzak Player Generator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0a0a0a;
  color: #fff;
  display: flex;
  justify-content: center;
  padding: 40px;
}

.container {
  width: 420px;
  background: #111;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 20px #000;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  font-size: 12px;
  opacity: 0.6;
  margin-bottom: 20px;
}

input, button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 6px;
  border: none;
}

input {
  background: #222;
  color: #fff;
}

button {
  background: #fff;
  color: #000;
  cursor: pointer;
  font-weight: bold;
}

.options {
  margin-top: 15px;
  font-size: 13px;
}

.options label {
  display: block;
  margin: 6px 0;
}

.desc {
  font-size: 11px;
  opacity: 0.5;
  margin-left: 5px;
}

.preview {
  margin-top: 15px;
  width: 100%;
  height: 200px;
  background: #000;
}

.output {
  margin-top: 10px;
  font-size: 11px;
  background: #000;
  padding: 8px;
  word-break: break-all;
}
</style>
</head>

<body>

<div class="container">
<h1>Øzak Player</h1>
<div class="subtitle">Generator • by Øzak</div>

<input id="url" placeholder="Lien vidéo Dropbox ou direct">

<div class="options">
<label><input type="checkbox" id="autoplay" checked> Autoplay <span class="desc">(démarre seul)</span></label>
<label><input type="checkbox" id="loop"> Loop <span class="desc">(boucle)</span></label>
<label><input type="checkbox" id="mute"> Muted <span class="desc">(sans son)</span></label>
<label><input type="checkbox" id="controls"> Controls <span class="desc">(barre visible)</span></label>
<label><input type="checkbox" id="responsive" checked> Responsive <span class="desc">(adaptatif)</span></label>
</div>

<button onclick="preview()">🎬 Preview</button>
<button onclick="generate()">⚡ Générer le lien</button>
<button onclick="copy()">📋 Copier</button>

<iframe id="preview" class="preview"></iframe>

<div id="output" class="output"></div>
</div>

<script>
function buildURL() {
  const base = "player.html";

  const params = new URLSearchParams();
  params.set("url", document.getElementById("url").value);
  params.set("autoplay", autoplay.checked ? 1 : 0);
  params.set("loop", loop.checked ? 1 : 0);
  params.set("mute", mute.checked ? 1 : 0);
  params.set("controls", controls.checked ? 1 : 0);
  params.set("responsive", responsive.checked ? 1 : 0);

  return base + "?" + params.toString();
}

function preview() {
  document.getElementById("preview").src = buildURL();
}

function generate() {
  const link = buildURL();
  document.getElementById("output").innerText = link;
}

function copy() {
  navigator.clipboard.writeText(document.getElementById("output").innerText);
  alert("Lien copié !");
}
</script>

</body>
</html>
