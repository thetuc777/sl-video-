<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL Video Manager</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  :root {
    --bg: #080808;
    --surface: #111;
    --border: #2c2c2c;
    --border-light: #444;
    --text: #e8e6e0;
    --muted: #666;
    --accent: #c8c0a8;
    --white: #f0ede6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem 5rem;
    position: relative;
    overflow-x: hidden;
  }

  /* Motif runique en fond */
  body::before {
    content: 'ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᛟ';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    font-size: 13px;
    color: rgba(255,255,255,0.025);
    letter-spacing: 18px;
    line-height: 2.8;
    word-spacing: 20px;
    pointer-events: none;
    z-index: 0;
    padding: 2rem;
  }

  * { position: relative; z-index: 1; }

  /* Ligne déco top */
  .top-rule {
    width: 100%;
    max-width: 520px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 3rem;
  }
  .top-rule::before, .top-rule::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-light), transparent);
  }
  .top-rule span {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 6px;
    color: var(--muted);
    text-transform: uppercase;
    white-space: nowrap;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: 2.6rem;
    font-weight: 900;
    color: var(--white);
    letter-spacing: 8px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 0.6rem;
    line-height: 1.1;
  }

  .rune-sub {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 10px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 0.8rem;
  }

  .sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 3.5rem;
    font-weight: 300;
  }

  /* Séparateur runique */
  .divider {
    width: 100%;
    max-width: 520px;
    text-align: center;
    margin: 0 0 2rem;
    position: relative;
  }
  .divider::before {
    content: '';
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }
  .divider span {
    background: var(--bg);
    padding: 0 16px;
    font-family: 'Cinzel', serif;
    font-size: 20px;
    color: #ccc;
    letter-spacing: 4px;
  }

  .section {
    width: 100%;
    max-width: 520px;
    margin-bottom: 2.5rem;
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: #bbb;
    text-transform: uppercase;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  label {
    display: block;
    font-size: 14px;
    font-style: italic;
    color: #aaa;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  input[type="text"] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-light);
    padding: 10px 4px;
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s;
    letter-spacing: 0.5px;
  }
  input[type="text"]::placeholder { color: var(--muted); font-style: italic; }
  input[type="text"]:focus { border-bottom-color: var(--accent); }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .opt {
    border: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    user-select: none;
    background: transparent;
  }
  .opt:hover { border-color: var(--border-light); background: rgba(255,255,255,0.02); }
  .opt.active { border-color: var(--accent); background: rgba(200,192,168,0.05); }
  .opt input { display: none; }

  .opt-rune {
    font-size: 22px;
    color: var(--muted);
    width: 28px;
    text-align: center;
    transition: color 0.2s;
  }
  .opt.active .opt-rune { color: var(--accent); }

  .opt-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text);
    text-transform: uppercase;
  }
  .opt-desc {
    font-size: 11px;
    font-style: italic;
    color: var(--muted);
    margin-top: 2px;
  }

  .check {
    margin-left: auto;
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .opt.active .check { opacity: 1; }

  /* Bouton principal */
  .btn-wrap {
    width: 100%;
    max-width: 520px;
    position: relative;
    margin-top: 1rem;
  }

  .btn {
    width: 100%;
    padding: 18px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
    position: relative;
    overflow: hidden;
  }
  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: var(--accent);
    transition: left 0.3s ease;
    z-index: 0;
  }
  .btn:hover::before { left: 0; }
  .btn:hover { color: var(--bg); }
  .btn span { position: relative; z-index: 1; }

  /* Coins décoratifs */
  .btn-wrap::before, .btn-wrap::after {
    content: 'ᚠ';
    position: absolute;
    top: 50%; transform: translateY(-50%);
    font-size: 16px;
    color: var(--muted);
    z-index: 2;
  }
  .btn-wrap::before { left: -28px; }
  .btn-wrap::after { right: -28px; }

  /* Résultat */
  .result {
    display: none;
    width: 100%;
    max-width: 520px;
    margin-top: 2.5rem;
  }

  .result-inner {
    border: 1px solid var(--border-light);
    padding: 2rem;
    position: relative;
  }

  /* Coins de cadre */
  .result-inner::before, .result-inner::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
  }
  .result-inner::before {
    top: -1px; left: -1px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
  }
  .result-inner::after {
    bottom: -1px; right: -1px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
  }

  .result-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }

  .url-display {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    color: var(--accent);
    word-break: break-all;
    margin-bottom: 1.5rem;
    line-height: 1.8;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
    letter-spacing: 0.3px;
  }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--border-light);
    color: var(--text);
    padding: 10px 24px;
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

  .hint {
    margin-top: 1.2rem;
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    line-height: 2;
    white-space: pre-line;
  }

  .bottom-rule {
    width: 100%;
    max-width: 520px;
    margin-top: 4rem;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 16px;
    letter-spacing: 8px;
    color: var(--border);
  }
</style>
</head>
<body>

<div class="top-rule"><span>Secundus Vita</span></div>

<h1>SL Video</h1>
<p class="rune-sub">ᚠ ᛁ ᛞ ᛖ ᛟ ᛗ ᚨ ᚾ ᚨ ᚷ ᛖ ᚱ</p>
<p class="sub">Forge ton lien vidéo pour Second Life</p>

<div class="section">
  <p class="section-title">I — Source Dropbox</p>
  <label>Lien de partage Dropbox</label>
  <input type="text" id="dropboxUrl" placeholder="https://www.dropbox.com/scl/fi/…" />
</div>

<div class="divider"><span>ᚦ</span></div>

<div class="section">
  <p class="section-title">II — Paramètres de lecture</p>
  <div class="options-grid">
    <div class="opt active" onclick="toggle(this, 'autoplay')">
      <input type="checkbox" id="autoplay" checked>
      <div class="opt-rune">ᚨ</div>
      <div><div class="opt-label">Autoplay</div><div class="opt-desc">Lecture auto</div></div>
      <div class="check">✦</div>
    </div>
    <div class="opt active" onclick="toggle(this, 'loop')">
      <input type="checkbox" id="loop" checked>
      <div class="opt-rune">ᛟ</div>
      <div><div class="opt-label">Loop</div><div class="opt-desc">Répétition</div></div>
      <div class="check">✦</div>
    </div>
    <div class="opt active" onclick="toggle(this, 'mute')">
      <input type="checkbox" id="mute" checked>
      <div class="opt-rune">ᛗ</div>
      <div><div class="opt-label">Mute</div><div class="opt-desc">Sans son</div></div>
      <div class="check">✦</div>
    </div>
    <div class="opt" onclick="toggle(this, 'controls')">
      <input type="checkbox" id="controls">
      <div class="opt-rune">ᚲ</div>
      <div><div class="opt-label">Contrôles</div><div class="opt-desc">Barre visible</div></div>
      <div class="check">✦</div>
    </div>
  </div>
</div>

<div class="divider"><span>ᚷ</span></div>

<div class="btn-wrap">
  <button class="btn" onclick="generate()"><span>Forger le lien</span></button>
</div>

<div class="result" id="result">
  <div class="result-inner">
    <p class="result-label">Lien pour Second Life</p>
    <div class="url-display" id="urlDisplay"></div>
    <button class="copy-btn" onclick="copyUrl()">Copier l'URL</button>
    <p class="hint" id="hint"></p>
  </div>
</div>

<div class="bottom-rule">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ</div>

<script>
function toggle(el, id) {
  el.classList.toggle('active');
  const cb = document.getElementById(id);
  cb.checked = !cb.checked;
}

function generate() {
  const url = document.getElementById('dropboxUrl').value.trim();
  if (!url.includes('dropbox.com')) {
    alert('Lien Dropbox invalide.');
    return;
  }
  const autoplay = document.getElementById('autoplay').checked;
  const loop = document.getElementById('loop').checked;
  const mute = document.getElementById('mute').checked;
  const controls = document.getElementById('controls').checked;

  const params = new URLSearchParams();
  params.set('url', url);
  if (autoplay) params.set('autoplay', '1');
  if (loop) params.set('loop', '1');
  if (mute) params.set('mute', '1');
  if (controls) params.set('controls', '1');

  const baseUrl = window.location.href.replace('index.html', '').replace(/\/+$/, '');
  const finalUrl = baseUrl + '/player.html?' + params.toString();

  document.getElementById('urlDisplay').textContent = finalUrl;
  document.getElementById('hint').textContent = '→ Colle cette URL dans Media > Video URI dans Second Life\n→ Nouvelle vidéo = nouveau lien Dropbox, regénère';
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}

function copyUrl() {
  const txt = document.getElementById('urlDisplay').textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copié ✦';
    setTimeout(() => btn.textContent = "Copier l'URL", 2000);
  });
}
</script>
</body>
</html>
