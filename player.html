<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>
<script>
  const p = new URLSearchParams(window.location.search);
  const id = p.get('id');
  const autoplay = p.get('autoplay') === '1' ? 1 : 0;
  const loop = p.get('loop') === '1' ? 1 : 0;
  const mute = p.get('mute') === '1' ? 1 : 0;
  const controls = p.get('controls') === '1' ? 1 : 0;

  if (id) {
    const src = `https://drive.google.com/file/d/${id}/preview?autoplay=${autoplay}&loop=${loop}&mute=${mute}`;
    const iframe = document.createElement('iframe');
    iframe.src = src;
    iframe.allow = 'autoplay';
    iframe.allowFullscreen = true;
    document.body.appendChild(iframe);

    if (!controls) {
      const style = document.createElement('style');
      style.textContent = 'iframe { pointer-events: none; }';
      document.head.appendChild(style);
    }
  }
</script>
</body>
</html>
