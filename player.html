<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  video {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain; /* 🔥 FIX → plus de déformation */
    background: #000;
  }

  /* Mode plein écran forcé (option responsive OFF) */
  .fill video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>

</head>
<body>

<script>
const p = new URLSearchParams(window.location.search);

const url = p.get('url');
const autoplay = p.get('autoplay') === '1';
const loop = p.get('loop') === '1';
const mute = p.get('mute') === '1';
const controls = p.get('controls') === '1';
const responsive = p.get('responsive') !== '0'; // ON par défaut

if (!responsive) {
  document.body.classList.add("fill");
}

if (url) {

  // 🔥 Conversion Dropbox propre
  let directUrl = url
    .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
    .replace('?dl=0', '')
    .replace('&dl=0', '')
    .replace('?dl=1', '')
    .replace('&dl=1', '');

  const video = document.createElement('video');

  video.src = directUrl;

  if (autoplay) video.autoplay = true;
  if (loop) video.loop = true;
  if (mute) video.muted = true;

  if (controls) {
    video.controls = true;
  } else {
    video.controls = false;
  }

  video.playsInline = true;

  // 🔥 Important pour autoplay navigateur
  if (autoplay && !mute) {
    video.muted = true;
  }

  document.body.appendChild(video);
}
</script>

</body>
</html>
