<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<script>
  const p = new URLSearchParams(window.location.search);
  const url = p.get('url');
  const autoplay = p.get('autoplay') === '1';
  const loop = p.get('loop') === '1';
  const mute = p.get('mute') === '1';
  const controls = p.get('controls') === '1';

  if (url) {
    // Convertir n'importe quel lien Dropbox en lien de téléchargement direct
    let directUrl = url
      .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
      .replace('&dl=0', '&dl=1')
      .replace('?dl=0', '?dl=1')
      .replace('&st=', '&raw=1&st=');

    // Si le lien contient encore dl=0 ou pas de dl=1, forcer dl=1
    if (!directUrl.includes('dl=1') && !directUrl.includes('raw=1')) {
      directUrl += (directUrl.includes('?') ? '&' : '?') + 'dl=1';
    }

    const video = document.createElement('video');
    video.src = directUrl;
    if (autoplay) video.autoplay = true;
    if (loop) video.loop = true;
    if (mute) video.muted = true;
    if (controls) video.controls = true;
    video.playsInline = true;
    document.body.appendChild(video);
  }
</script>
</body>
</html>
