<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

video {
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
}

.fill video {
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>

</head>
<body>

<script>
const p = new URLSearchParams(window.location.search);

const url = p.get('url');
const autoplay = p.get('autoplay') === '1';
const loop = p.get('loop') === '1';
const mute = p.get('mute') === '1';
const controls = p.get('controls') === '1';
const responsive = p.get('responsive') !== '0';

if (!responsive) document.body.classList.add("fill");

if (url) {

  let directUrl = url
    .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
    .replace('?dl=0','')
    .replace('&dl=0','')
    .replace('?dl=1','')
    .replace('&dl=1','');

  const video = document.createElement('video');

  video.src = directUrl;
  video.autoplay = autoplay;
  video.loop = loop;
  video.muted = mute;
  video.controls = controls;
  video.playsInline = true;

  document.body.appendChild(video);
}
</script>

</body>
</html>
