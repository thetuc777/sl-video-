<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  display:block;
}

/* MODES */
.contain{object-fit:contain;}
.cover{object-fit:cover;}
</style>
</head>

<body>

<script>
const p=new URLSearchParams(location.search);

let url=p.get("url");

let direct=url
.replace("www.dropbox.com","dl.dropboxusercontent.com")
.replace("?dl=0","");

if(!direct.includes("dl=1")){
  direct+=(direct.includes("?")?"&":"?")+"dl=1";
}

const v=document.createElement("video");

v.src=direct;

v.autoplay=p.get("autoplay")==="1";
v.loop=p.get("loop")==="1";
v.muted=p.get("mute")==="1";
v.controls=p.get("controls")==="1";

v.playsInline=true;
v.preload="metadata";

/* autoplay fix */
if(v.autoplay){
  v.muted=true;
  v.play().catch(()=>{});
}

/* FIT */
if(p.get("cover")==="1"){
  v.classList.add("cover");
}else{
  v.classList.add("contain");
}

/* RESPONSIVE OFF */
if(p.get("responsive")!=="1"){
  v.style.width="auto";
  v.style.height="auto";
}

document.body.appendChild(v);
</script>

</body>
</html>
